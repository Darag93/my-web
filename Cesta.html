<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Česká republika - Japonsko</title>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            text-align: center;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
        }

        /* Hlavní nadpis: Georgia, 36pt, černá */
        h1 {
            font-family: 'Georgia', serif;
            font-size: 36pt;
            font-weight: bold;
            margin-bottom: 25px;
            color: #000000;
        }

        .map-container {
            width: 100%;
            height: 400px;
            border: 1px solid #b0b0b0;
            margin-bottom: 25px;
            border-radius: 4px;
            overflow: hidden;
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Texty: Georgia, 22pt, černá */
        .text-block {
            font-family: 'Georgia', serif;
            font-size: 22pt;
            line-height: 1.5;
            margin: 15px 0;
            color: #000000;
        }

        .highlight-red {
            color: #d32f2f;
            font-weight: bold;
        }

        .rotoped-img {
            max-width: 300px;
            height: auto;
            margin: 15px 0 5px 0;
        }

        /* Popisek rotopedu: Calibri, 11pt, černá */
        .rotoped-title {
            font-family: 'Calibri', Arial, sans-serif;
            font-size: 11pt;
            color: #000000;
            margin-top: 5px;
        }

        /* Datum: Calibri, 11pt, černá */
        .date-text {
            font-family: 'Calibri', Arial, sans-serif;
            font-size: 11pt;
            color: #000000;
            margin-top: 20px;
        }

        /* Ovládací panel pro zadávání km */
        .control-panel {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
            margin-top: 40px;
            display: inline-block;
        }

        input[type="number"] {
            padding: 8px;
            font-size: 16px;
            width: 110px;
            text-align: center;
        }

        button {
            padding: 8px 16px;
            font-size: 16px;
            background-color: #3f51b5;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
            font-weight: bold;
        }

        button:hover {
            background-color: #303f9f;
        }

        .btn-edit {
            background-color: #e65100;
        }

        .btn-edit:hover {
            background-color: #ef6c00;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Česká republika - Japonsko</h1>

        <!-- Google Maps okno -->
        <div class="map-container">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m28!1m12!1m3!1d157640000.0!2d80.0!3d50.0!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!4m13!3e0!4m5!1s0x471253c076c8cb9d%3A0x400af0f6614b000!2s%C5%BDidlochovice!3m2!1d49.0435!2d16.6202!4m5!1s0x60188b857628235d%3A0xcdd8aef707a2b970!2sTokio%2C%20Japonsko!3m2!1d35.6762!2d139.6503!5e0!3m2!1scs!2scz!4v1690000000000!5m2!1scs!2scz"
                allowfullscreen="" loading="lazy"></iframe>
        </div>

        <!-- Texty -->
        <div class="text-block">
            Ze Židlochovic do Tokia<br>
            Cíl 9 100 km (vzdušná čára)<br>
            Cíl 11 500 km (pozemní trasa na kole)
        </div>

        <div class="text-block" style="margin-top: 20px;">
            Ujeto <span id="ujeto-km" class="highlight-red">149</span> km <span id="ujeto-proc"
                class="highlight-red">1,26 %</span> cesty
        </div>

        <!-- Obrázek rotopedu podle zadané adresy -->
        <div>
            <img src="https://www.insportline.cz/p165633/Rotoped-inSPORTLine-inCondi-UB600i-26.jpg"
                alt="Rotoped inSPORTline inCondi UB600i" class="rotoped-img">
            <div class="rotoped-title">Rotoped inSPORTline inCondi UB600i</div>
        </div>

        <!-- Datum -->
        <div class="date-text">
            13.8.2025 jízda započala.
        </div>

        <!-- Ovládací panel -->
        <div class="control-panel">
            <strong>Osobní panel pro zadávání jízd (vyžaduje heslo):</strong><br><br>
            <label for="addKmInput">Přidat ujeté km: </label>
            <input type="number" id="addKmInput" placeholder="např. 30" min="1">
            <button onclick="pridatKilometry()">Přidat km</button>
            <button onclick="upravitCelkemKm()" class="btn-edit">Upravit celkové km</button>
        </div>
    </div>

    <script>
        const celkovaTrasaKm = 11500;
        const správnéHeslo = "sharingan";

        // Načtení z paměti prohlížeče (výchozí 149 km)
        let ujetoKm = localStorage.getItem('rotoped_tokio_km') ? parseFloat(localStorage.getItem('rotoped_tokio_km')) : 149;

        function aktualizujStranku() {
            let procenta = ((ujetoKm / celkovaTrasaKm) * 100).toFixed(2);
            document.getElementById('ujeto-km').innerText = ujetoKm;
            document.getElementById('ujeto-proc').innerText = procenta.replace('.', ',') + ' %';
        }

        function pridatKilometry() {
            let zadaneHeslo = prompt("Pro přidání kilometrů zadejte heslo:");
            if (zadaneHeslo !== správnéHeslo) {
                if (zadaneHeslo !== null) alert('Nesprávné heslo!');
                return;
            }

            let inputVal = document.getElementById('addKmInput').value;
            if (inputVal && !isNaN(inputVal) && parseFloat(inputVal) > 0) {
                ujetoKm += parseFloat(inputVal);
                localStorage.setItem('rotoped_tokio_km', ujetoKm);
                aktualizujStranku();
                document.getElementById('addKmInput').value = '';
                alert('Přičteno! Celkem ujeto: ' + ujetoKm + ' km.');
            } else {
                alert('Zadejte platné číslo!');
            }
        }

        function upravitCelkemKm() {
            let zadaneHeslo = prompt("Pro úpravu celkových kilometrů zadejte heslo:");
            if (zadaneHeslo !== správnéHeslo) {
                if (zadaneHeslo !== null) alert('Nesprávné heslo!');
                return;
            }

            let novaHodnota = prompt("Zadejte celkový počet ujetých kilometrů:", ujetoKm);
            if (novaHodnota !== null && !isNaN(novaHodnota) && parseFloat(novaHodnota) >= 0) {
                ujetoKm = parseFloat(novaHodnota);
                localStorage.setItem('rotoped_tokio_km', ujetoKm);
                aktualizujStranku();
                alert('Celkový stav ujetých km byl změněn na: ' + ujetoKm + ' km.');
            } else if (novaHodnota !== null) {
                alert('Zadejte platné číslo!');
            }
        }

        // Prvotní spuštění při načtení
        aktualizujStranku();
    </script>

</body>

</html>
