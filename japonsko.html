<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Česká republika - Japonsko</title>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            text-align: center;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
        }

        h1 {
            font-family: 'Georgia', serif;
            font-size: 36pt;
            font-weight: bold;
            margin-bottom: 25px;
            color: #000000;
        }

        .map-container {
            width: 100%;
            height: 400px;
            border: 1px solid #b0b0b0;
            margin-bottom: 25px;
            border-radius: 4px;
            overflow: hidden;
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .text-block {
            font-family: 'Georgia', serif;
            font-size: 22pt;
            line-height: 1.5;
            margin: 15px 0;
            color: #000000;
        }

        .highlight-red {
            color: #d32f2f;
            font-weight: bold;
        }

        .rotoped-img {
            max-width: 300px;
            height: auto;
            margin: 15px 0 5px 0;
        }

        .rotoped-title {
            font-family: 'Calibri', Arial, sans-serif;
            font-size: 11pt;
            color: #000000;
            margin-top: 5px;
        }

        .date-text {
            font-family: 'Calibri', Arial, sans-serif;
            font-size: 11pt;
            color: #000000;
            margin-top: 20px;
        }

        .control-panel {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
            margin-top: 40px;
            display: inline-block;
        }

        input[type="number"] {
            padding: 8px;
            font-size: 16px;
            width: 110px;
            text-align: center;
        }

        button {
            padding: 8px 16px;
            font-size: 16px;
            background-color: #3f51b5;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
            font-weight: bold;
        }

        button:hover {
            background-color: #303f9f;
        }

        .btn-edit {
            background-color: #e65100;
        }

        .btn-edit:hover {
            background-color: #ef6c00;
        }
    </style>
</head>
