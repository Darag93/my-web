<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>BioFlow 🐺</title>
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: #121212; /* ČERNÉ POZADÍ */
            color: #ffffff;
            margin: 0;
        }

        .container {
            max-width: 400px;
            margin: auto;
            display: flex;
            flex-direction: column;
            min-height: 95vh;
        }

        h1 {
            color: #00cf5d;
            font-size: 2.2rem;
            margin-bottom: 5px;
            margin-top: 20px;
            letter-spacing: -1px;
        }

        .subtitle {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .card {
            background: #1e1e1e; /* TMAVÁ KARTA */
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-align: left;
        }

        h2 {
            font-size: 1.3rem;
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .time-info {
            color: #00cf5d;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 1rem;
            display: block;
        }

        .file-label {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 8px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="file"] {
            display: block;
            width: 100%;
            font-size: 0.8rem;
            color: #aaa;
            background: #252525;
            padding: 10px;
            border-radius: 10px;
            border: none;
        }

        .btn-start {
            background: #00cf5d;
            color: #000;
            border: none;
            padding: 20px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            box-shadow: 0 10px 20px rgba(0, 207, 93, 0.2);
            margin-top: 10px;
        }

        .btn-start:active {
            transform: scale(0.98);
            background: #00a34a;
        }

        #status {
            margin-top: 20px;
            color: #00cf5d;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .footer {
            color: #444;
            font-size: 0.85rem;
            margin-top: auto;
            padding: 20px 0;
            border-top: 1px solid #222;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>BioFlow 🐺</h1>
        <div class="subtitle">Optimalizace těla a mysli</div>

        <div class="card">
            <h2>💧 Pitný režim</h2>
            <span class="time-info">450 ml každé 2 hodiny</span>
            <label class="file-label">Zvuk upozornění:</label>
            <input type="file" id="waterFile" accept="audio/*">
        </div>

        <div class="card">
            <h2>🚶 Aktivní pauza</h2>
            <span class="time-info">2 minuty každou hodinu</span>
            <label class="file-label">Zvuk upozornění:</label>
            <input type="file" id="walkFile" accept="audio/*">
        </div>

        <button class="btn-start" onclick="startApp()">SPUSTIT PROGRAM 🐺</button>
        <div id="status">Připraven ke startu</div>

        <div class="footer">
            Tvůrce: <b>Darag93</b>
        </div>
    </div>
