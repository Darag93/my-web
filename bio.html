<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioFlow 🐺</title>
    <link rel="stylesheet" href="styl.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container">
        <h1>BioFlow 🐺</h1>
        <p class="subtitle">Optimalizace těla a mysli</p>

        <div class="card">
            <h2>💧 Pitný režim</h2>
            <p class="status">450 ml každé 2 hodiny</p>
            <label>ZVUK UPOZORNĚNÍ:</label>
            <input type="file" id="waterSound" accept="audio/*">
        </div>

        <div class="card">
            <h2>🚶 Aktivní pauza</h2>
            <p class="status">2 minuty každou hodinu</p>
            <label>ZVUK UPOZORNĚNÍ:</label>
            <input type="file" id="breakSound" accept="audio/*">
        </div>

        <button id="startBtn" class="btn-main">SPUSTIT PROGRAM 🐺</button>
        <p id="systemStatus" class="ready">Připraven ke startu</p>

        <div class="footer">
            Tvůrce: <strong>Darag93</strong>
        </div>
    </div>

    <script src="sw.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        const startBtn = document.getElementById('startBtn');
        const systemStatus = document.getElementById('systemStatus');

        startBtn.addEventListener('click', () => {
            if (!("Notification" in window)) {
                alert("Notifikace nejsou podporovány.");
            } else if (Notification.permission === "granted") {
                startProgram();
            } else {
                Notification.requestPermission().then(p => {
                    if (p === "granted") startProgram();
                });
            }
        });

        function startProgram() {
            startBtn.textContent = "AKTIVOVÁNO";
            startBtn.classList.add('active');
            systemStatus.innerHTML = "✅ SYSTÉM BĚŽÍ";
            systemStatus.className = "running";
            
            new Notification("BioFlow Aktivován", {
                body: "Vlk tě teď bude hlídat!",
                icon: "https://cdn-icons-png.flaticon.com/512/2829/2829824.png"
            });
        }
    </script>
</body>
</html>
