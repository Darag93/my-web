<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darag z Moravy</title>
    <link rel="stylesheet" href="styl.css">
    <style>
        /* Styl pro sekci aplikace */
        .app-download-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 40px;
            max-width: 450px;
            text-decoration: none;
            color: white;
            transition: transform 0.2s, border-color 0.2s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .app-download-card:hover {
            transform: translateY(-5px);
            border-color: #00cf5d;
        }

        .app-icon {
            width: 80px;
            height: 80px;
            background: #121212;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            border: 2px solid #00cf5d;
        }

        .app-info {
            text-align: left;
        }

        .app-title {
            color: #00cf5d;
            font-weight: bold;
            font-size: 1.4rem;
            margin: 0;
        }

        .app-desc {
            color: #888;
            font-size: 0.9rem;
            margin: 5px 0 10px 0;
        }

        .install-badge {
            display: inline-block;
            background: #00cf5d;
            color: black;
            padding: 5px 15px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.8rem;
        }

        hr { border: 0; border-top: 1px solid #333; margin: 30px 0; }
    </style>
</head>
<body>

    </ul>

        <div class="app-icon">🐺</div>
        <div class="app-info">
            <p class="app-title">BioFlow 3.1</p>
            <p class="app-desc">Voda & Pohyb. Optimalizuj své tělo.</p>
            <span class="install-badge">STÁHNOUT / OTEVŘÍT APP</span>
        </div>
