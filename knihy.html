<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Daragová knihovna</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #f0f2f5; }
        .hero-section { 
            background-image: url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2000&auto=format&fit=crop');
            background-size: cover; background-position: center; height: 250px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: inset 0 0 0 2000px rgba(0, 0, 0, 0.5);
        }
        .hero-section h1 { color: white; font-size: 3rem; text-shadow: 2px 2px 8px #000; }
        nav { background: #2c3e50; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .nav-links a, .nav-links button { background: #34495e; color: white; text-decoration: none; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        .search-container input { padding: 8px; border-radius: 4px; border: none; width: 200px; }
        .container { max-width: 1200px; margin: 20px auto; padding: 20px; }
        .view-section { display: none; }
        .view-section.active { display: block; }
        .login-box { text-align: center; max-width: 400px; margin: 50px auto; padding: 30px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-admin { background: #27ae60; color: white; border: none; padding: 12px; width: 100%; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-guest { background: #3498db; color: white; border: none; padding: 12px; width: 100%; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }
        .book-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; position: relative; }
        .book-card img { width: 100%; height: 350px; object-fit: cover; border-radius: 4px; }
        .rating-area { background: #f9f9f9; padding: 10px; border-radius: 6px; margin-top: 10px; border: 1px solid #eee; }
        .admin-stars { color: #d35400; font-weight: bold; font-size: 1.1em; margin-bottom: 5px; }
        .user-stars { color: #2980b9; font-size: 0.9em; }
        .rate-btn { background: #e67e22; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-top: 8px; width: 100%; }
        #admin-panel { background: #e8f5e9; padding: 20px; border-radius: 8px; margin-bottom: 30px; border: 2px solid #27ae60; }
    </style>
</head>
<body>

<header class="hero-section">
    <h1>Daragová knihovna</h1>
</header>

<nav>
    <div class="nav-links">
        <a href="https://darag93.github.io/my-web/">Zpět na hlavní web</a>
        <button onclick="location.reload()">Odhlásit / Menu</button>
    </div>
    <div class="search-container" id="search-ui" style="display:none;">
        <input type="text" id="search-input" placeholder="Hledejte..." onkeyup="searchBooks()">
    </div>
</nav>

<div class="container">
    <div id="view-login" class="view-section active">
        <div class="login-box">
            <h2>Vstup do knihovny</h2>
            <button class="btn-guest" onclick="enterAsGuest()">Vstoupit bez přihlášení</button>
            <hr style="margin: 25px 0;">
            <h3>Administrátor</h3>
            <input type="password" id="admin-pass" placeholder="Zadejte heslo...">
            <button class="btn-admin" onclick="enterAsAdmin()">Přihlásit jako Admin</button>
        </div>
    </div>

    <div id="view-db" class="view-section">
        <div id="admin-panel" style="display:none;">
            <h3>➕ Přidat novou knihu</h3>
            <form id="add-form">
                <input type="text" id="in-title" placeholder="Název knihy" required>
                <input type="text" id="in-author" placeholder="Autor" required>
                <select id="in-genre">
                    <optgroup label="Beletrie">
                        <option>Beletrie a vyprávění</option><option>Detektivky, krimi</option><option>Fantasy</option><option>Sci-fi</option><option>Romány</option>
                    </optgroup>
                    <optgroup label="Naučná">
                        <option>Historie</option><option>Biografie</option><option>Psychologie</option><option>Kuchařky</option>
                    </optgroup>
                </select>
                <input type="number" id="in-year" placeholder="Rok vydání">
                <input type="text" id="in-isbn" placeholder="ISBN">
                <input type="text" id="in-pub" placeholder="Vydavatelství">
                <label><b>Moje hodnocení (1-10):</b></label>
                <input type="number" id="in-admin-score" min="1" max="10" value="10">
                <label>Obrázek:</label>
                <input type="file" id="in-img" accept="image/*" required>
                <button type="submit" class="btn-admin">Uložit knihu</button>
            </form>
        </div>

        <div class="book-grid" id="book-list"></div>
    </div>
</div>

<script>
    const SECRET = "Itachi";
    let isAdmin = false;
    let books = JSON.parse(localStorage.getItem('libData')) || [];

    function enterAsGuest() { isAdmin = false; renderDB(); }
    function enterAsAdmin() {
        if(document.getElementById('admin-pass').value === SECRET) { isAdmin = true; renderDB(); }
        else { alert("Špatné heslo!"); }
    }

    function renderDB() {
        document.getElementById('view-login').classList.remove('active');
        document.getElementById('view-db').classList.add('active');
        document.getElementById('search-ui').style.display = 'block';
        if(isAdmin) document.getElementById('admin-panel').style.display = 'block';
        displayBooks(books);
    }

    document.getElementById('add-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const reader = new FileReader();
        reader.onload = function(event) {
            const newBook = {
                id: Date.now(),
                title: document.getElementById('in-title').value,
                author: document.getElementById('in-author').value,
                genre: document.getElementById('in-genre').value,
                year: document.getElementById('in-year').value,
                isbn: document.getElementById('in-isbn').value,
                pub: document.getElementById('in-pub').value,
                adminScore: document.getElementById('in-admin-score').value,
                userVotes: [], // Zde se budou ukládat hlasy od lidí
                img: event.target.result
            };
            books.push(newBook);
            save();
            displayBooks(books);
            document.getElementById('add-form').reset();
        };
        reader.readAsDataURL(document.getElementById('in-img').files[0]);
    });

    function displayBooks(data) {
        const list = document.getElementById('book-list');
        list.innerHTML = '';
        data.forEach(b => {
            const userAvg = b.userVotes.length > 0 
                ? (b.userVotes.reduce((a,v) => a+v, 0) / b.userVotes.length).toFixed(1) 
                : "0.0";

            list.innerHTML += `
                <div class="book-card">
                    <img src="${b.img}">
                    <h3>${b.title}</h3>
                    <p><b>${b.author}</b></p>
                    <div class="rating-area">
                        <div class="admin-stars">⭐ Admin: ${b.adminScore}/10</div>
                        <div class="user-stars">👥 Čtenáři: ${userAvg}/10 (${b.userVotes.length}x)</div>
                        <button class="rate-btn" onclick="userRate(${b.id})">Dát hodnocení</button>
                    </div>
                    <p style="font-size:0.8em; color:gray; margin-top:10px;">${b.genre} | ISBN: ${b.isbn}</p>
                </div>
            `;
        });
    }

    function userRate(id) {
        const score = prompt("Zadejte vaše hodnocení (1-10):");
        const num = parseInt(score);
        if(num >= 1 && num <= 10) {
            const book = books.find(b => b.id === id);
            book.userVotes.push(num);
            save();
            displayBooks(books);
        } else if (score !== null) {
            alert("Prosím zadejte číslo od 1 do 10.");
        }
    }

    function searchBooks() {
        const q = document.getElementById('search-input').value.toLowerCase();
        const filtered = books.filter(b => 
            b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q)
        );
        displayBooks(filtered);
    }

    function save() { localStorage.setItem('libData', JSON.stringify(books)); }
</script>

</body>
</html>
