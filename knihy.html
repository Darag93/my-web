<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daragová knihovna</title>
    <style>
        :root { --dark: #1a1a1a; --gold: #d4af37; --bg: #f4f1ea; --accent: #8b0000; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: var(--bg); }

        /* HEADER */
        .hero { 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2000');
            background-size: cover; background-position: center; height: 180px;
            display: flex; align-items: center; justify-content: center; color: white;
        }

        /* NAVIGACE - Defaultně schovaná přes ID */
        #navbar { 
            background: var(--dark); padding: 0 5%; display: none; /* Schováno */
            justify-content: space-between; align-items: center; 
            position: sticky; top: 0; z-index: 1000; height: 60px;
        }
        .nav-menu { display: flex; gap: 15px; }
        .nav-menu button { 
            background: transparent; color: white; border: none; padding: 10px; 
            cursor: pointer; font-size: 14px; font-weight: bold;
        }
        .nav-menu button:hover { color: var(--gold); }
        
        .nav-right { display: flex; align-items: center; gap: 10px; }
        .search-box input { padding: 8px; border-radius: 20px; border: 1px solid #444; background: #333; color: white; width: 180px; }

        /* STRÁNKY */
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .page { display: none; }
        .page.active { display: block !important; }

        /* PŘIHLÁŠENÍ */
        .login-card { 
            max-width: 500px; margin: 50px auto; background: white; padding: 40px; 
            border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; 
        }
        .btn-guest { width: 100%; padding: 15px; background: #222; color: white; border: none; cursor: pointer; font-weight: bold; margin-bottom: 20px; border-radius: 4px; }
        .btn-admin { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; }

        /* KNIHY */
        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }
        .book-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .book-card img { width: 100%; height: 350px; object-fit: cover; }
        .book-info { padding: 15px; }
    </style>
</head>
<body>

<header class="hero">
    <h1>Daragová knihovna</h1>
</header>

<nav id="navbar">
    <div class="nav-menu">
        <button onclick="openPage('p-news')">✨ NOVINKY</button>
        <button onclick="openPage('p-top')">🏆 TOP 10</button>
        <button onclick="openPage('p-all')">📚 KNIHY</button>
        <button id="admin-only-btn" onclick="openPage('p-add')" style="display:none; color:var(--gold);">➕ PŘIDAT</button>
    </div>
    <div class="nav-right">
        <div class="search-box"><input type="text" placeholder="Hledat..." onkeyup="search()"></div>
        <button onclick="location.reload()" style="background:none; border:1px solid #555; color:white; cursor:pointer; padding:5px; border-radius:4px;">Odhlásit</button>
    </div>
</nav>

<div class="container">

    <div id="p-login" class="page active">
        <div class="login-card">
            <h2>Vstoupit do knihovny</h2>
            <button class="btn-guest" onclick="handleLogin(false)">Vstoupit bez přihlášení</button>
            <hr style="margin: 20px 0; opacity: 0.2;">
            <h3>Pro správce</h3>
            <input type="password" id="adminPass" placeholder="Heslo" style="width:100%; padding:10px; margin-bottom:10px; text-align:center;">
            <button class="btn-admin" onclick="handleLogin(true)">Přihlásit jako Admin</button>
        </div>
    </div>

    <div id="p-news" class="page"><h2>✨ Novinky</h2><div class="book-grid" id="news-box"></div></div>
    <div id="p-all" class="page"><h2>📚 Všechny knihy</h2><div class="book-grid" id="all-box"></div></div>
    <div id="p-top" class="page"><h2>🏆 TOP 10</h2><div id="top-box"></div></div>
    
    <div id="p-add" class="page">
        <h2>➕ Přidat knihu</h2>
        <div style="background:white; padding:20px; border-radius:8px;">
            <p>Zde bude tvůj formulář pro přidávání (ten už máš v pořádku).</p>
        </div>
    </div>

</div>

<script>
    // 1. Základní nastavení
    let isAdmin = false;

    // 2. Hlavní funkce přihlášení - OPRAVENÁ
    function handleLogin(isSpec) {
        const nav = document.getElementById('navbar');
        const loginPage = document.getElementById('p-login');
        const adminBtn = document.getElementById('admin-only-btn');

        if (isSpec) {
            const pass = document.getElementById('adminPass').value;
            if (pass === "Itachi") {
                isAdmin = true;
                adminBtn.style.display = "block"; // Ukáže tlačítko PLUS
            } else {
                alert("Špatné heslo!");
                return;
            }
        }

        // Tady se děje to kouzlo:
        loginPage.classList.remove('active'); // Schová login kartu
        nav.style.display = "flex";            // Ukáže černou lištu
        openPage('p-news');                   // Skočí na novinky
    }

    // 3. Přepínání stránek
    function openPage(pageId) {
        // Schovej všechny stránky
        const pages = document.querySelectorAll('.page');
        pages.forEach(p => p.classList.remove('active'));

        // Ukaž tu vybranou
        const target = document.getElementById(pageId);
        if (target) {
            target.classList.add('active');
        }
    }
</script>

</body>
</html>
