<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Daragova knihovna</title>

<style>
:root { --dark:#1a1a1a; --gold:#d4af37; --bg:#f4f1ea; }

body { margin:0; font-family:Segoe UI; background:var(--bg); }

/* HERO */
.hero {
    height:220px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    text-align:center;
    font-size:30px;
    font-weight:bold;

    background:
    linear-gradient(rgba(0,0,0,.7), rgba(0,0,0,.7)),
    url('https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=1600&q=80');

    background-size:cover;
    background-position:center;
}

/* NAV */
#nav {
    display:none;
    background:var(--dark);
    color:white;
    padding:10px;
    justify-content:space-between;
    align-items:center;
}

.menu button {
    background:none;
    border:none;
    color:white;
    margin-right:10px;
    cursor:pointer;
}

.menu button:hover { color:var(--gold); }

/* PAGE */
.page { display:none; padding:20px; }
.active { display:block; }

/* LOGIN */
.login {
    max-width:400px;
    margin:50px auto;
    background:white;
    padding:30px;
    text-align:center;
    border-radius:10px;
}

/* GRID */
.grid {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:20px;
}

/* CARD */
.card {
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.card img {
    width:100%;
    height:300px;
    object-fit:cover;
}

.card div { padding:10px; }

/* INPUT */
input {
    padding:8px;
    width:90%;
}

/* BUTTON */
button {
    padding:8px 12px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="hero">Daragova knihovna</div>

<!-- NAV -->
<div id="nav">
    <div class="menu">
        <button onclick="openPage('news')">✨ Novinky</button>
        <button onclick="openPage('top')">🏆 TOP</button>
        <button onclick="openPage('all')">📚 Knihy</button>
        <button onclick="openPage('add')" id="addBtn" style="display:none;">➕ Přidat</button>

        <button onclick="sortByAuthor()">🔤 Autor</button>
        <button onclick="sortByYear()">📅 Rok</button>
        <button onclick="sortByRating()">⭐ Hodnocení</button>

        <button onclick="goBack()">🌐 Web</button>
    </div>

    <input id="search" placeholder="Hledat..." onkeyup="searchBooks()">
</div>

<!-- LOGIN -->
<div id="login" class="page active">
    <div class="login">
        <h2>Vstup do knihovny</h2>
        <button onclick="login(false)">Vstoupit bez přihlášení</button>
        <hr>
        <input id="pass" type="password" placeholder="Admin heslo">
        <button onclick="login(true)">Přihlásit jako admin</button>
    </div>
</div>

<!-- PAGES -->
<div id="news" class="page"><h2>Novinky</h2><div id="newsBox" class="grid"></div></div>
<div id="all" class="page"><h2>Knihy</h2><div id="allBox" class="grid"></div></div>
<div id="top" class="page"><h2>TOP</h2><div id="topBox"></div></div>

<!-- ADD -->
<div id="add" class="page">
<h2>Přidat knihu</h2>
<form id="form">

<input id="t" placeholder="Název knihy" required><br><br>
<input id="a" placeholder="Autor" required><br><br>
<input id="g" placeholder="Žánr"><br><br>
<input id="pub" placeholder="Vydavatelství"><br><br>
<input id="y" type="number" placeholder="Rok vydání"><br><br>
<input id="p" type="number" placeholder="Počet stran"><br><br>
<input id="l" placeholder="Jazyk"><br><br>
<input id="isbn" placeholder="ISBN"><br><br>
<input id="r" type="number" placeholder="Hodnocení 1-10"><br><br>
<input id="img" type="file" required><br><br>

<button>Uložit</button>
</form>
</div>

<script>
let admin=false;
let books=JSON.parse(localStorage.getItem('books'))||[];

/* LOGIN */
function login(isAdminLogin){
    if(isAdminLogin){
        if(pass.value!=="Itachi"){
            alert("Špatné heslo");
            return;
        }
        admin=true;
        addBtn.style.display="inline";
    }

    login.style.display="none";
    nav.style.display="flex";

    openPage('news');
    render();
}

/* NAV */
function openPage(id){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

/* BACK */
function goBack(){
    window.location.href="https://darag93.github.io/my-web/";
}

/* ADD */
form.onsubmit=function(e){
    e.preventDefault();

    const reader=new FileReader();
    reader.onload=e=>{

        books.unshift({
            id: Date.now(),
            title: t.value,
            author: a.value,
            genre: g.value,
            year: y.value,
            pages: p.value,
            language: l.value,
            publisher: pub.value,
            isbn: isbn.value,
            rating: r.value,
            img: e.target.result
        });

        localStorage.setItem('books',JSON.stringify(books));
        form.reset();
        render();
    };

    reader.readAsDataURL(img.files[0]);
};

/* CARD */
const card = b => `
<div class="card">
<img src="${b.img}">
<div>
<h3>${b.title}</h3>
<p><b>${b.author}</b></p>
<p>📚 ${b.genre||"-"}</p>
<p>📅 ${b.year||"-"}</p>
<p>🌍 ${b.language||"-"}</p>
<p>🏢 ${b.publisher||"-"}</p>
<p>📖 ${b.pages||"-"} stran</p>
<p>🔢 ${b.isbn||"-"}</p>
<b>⭐ ${b.rating||0}/10</b>
</div>
</div>`;

/* RENDER */
function render(){
    newsBox.innerHTML=books.slice(0,4).map(card).join('');
    allBox.innerHTML=books.map(card).join('');

    const top=[...books].sort((a,b)=>b.rating-a.rating);
    topBox.innerHTML=top.map((b,i)=>`#${i+1} ${b.title}`).join('<br>');
}

/* SEARCH */
function searchBooks(){
    const q=search.value.toLowerCase();

    const f=books.filter(b =>
        b.title.toLowerCase().includes(q) ||
        b.author.toLowerCase().includes(q) ||
        (b.genre && b.genre.toLowerCase().includes(q)) ||
        (b.publisher && b.publisher.toLowerCase().includes(q))
    );

    allBox.innerHTML=f.map(card).join('');
    openPage('all');
}

/* SORT */
function sortByAuthor(){
    books.sort((a,b)=>a.author.localeCompare(b.author));
    render();
}

function sortByYear(){
    books.sort((a,b)=>b.year - a.year);
    render();
}

function sortByRating(){
    books.sort((a,b)=>b.rating - a.rating);
    render();
}
</script>

</body>
</html>
