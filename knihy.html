<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Daragová knihovna</title>

<style>
:root { --dark:#1a1a1a; --gold:#d4af37; --bg:#f4f1ea; --accent:#8b0000; }

body { margin:0; font-family:Segoe UI; background:var(--bg); }

/* HEADER */
.hero {
    height:180px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
    url('https://images.unsplash.com/photo-1507842217343-583bb7270b66');
}

/* NAV */
#nav { display:none; background:var(--dark); color:white; padding:10px; display:none; justify-content:space-between; align-items:center; }
.menu button { background:none; border:none; color:white; margin-right:10px; cursor:pointer; }
.menu button:hover { color:var(--gold); }

/* PAGES */
.page { display:none; padding:20px; }
.active { display:block; }

/* LOGIN */
.login { max-width:400px; margin:40px auto; background:white; padding:30px; text-align:center; }

/* BOOK */
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:20px; }
.card { background:white; padding:10px; border-radius:6px; }
.card img { width:100%; height:300px; object-fit:cover; }
</style>
</head>

<body>

<div class="hero"><h1>Daragová knihovna</h1></div>

<div id="nav">
    <div class="menu">
        <button onclick="openPage('news')">✨ Novinky</button>
        <button onclick="openPage('top')">🏆 TOP</button>
        <button onclick="openPage('all')">📚 Knihy</button>
        <button onclick="openPage('chat')">💬 Diskuze</button>
        <button id="addBtn" style="display:none;" onclick="openPage('add')">➕ Přidat</button>
    </div>
    <input id="search" placeholder="Hledat..." onkeyup="search()">
</div>

<!-- LOGIN -->
<div id="login" class="page active">
    <div class="login">
        <button onclick="login(false)">Vstoupit</button>
        <hr>
        <input id="pass" type="password" placeholder="Heslo">
        <button onclick="login(true)">Admin</button>
    </div>
</div>

<!-- PAGES -->
<div id="news" class="page"><h2>Novinky</h2><div id="newsBox" class="grid"></div></div>
<div id="all" class="page"><h2>Knihy</h2><div id="allBox" class="grid"></div></div>
<div id="top" class="page"><h2>TOP</h2><div id="topBox"></div></div>

<div id="add" class="page">
<h2>Přidat</h2>
<form id="form">
<input id="t" placeholder="Název" required>
<input id="a" placeholder="Autor" required>
<input id="r" type="number" placeholder="Hodnocení">
<input id="img" type="file" required>
<button>Uložit</button>
</form>
</div>

<div id="chat" class="page">
<h2>Diskuze</h2>
<div id="chatList"></div>
<input id="msg"><button onclick="send()">Odeslat</button>
</div>

<script>
let admin=false;
let books=JSON.parse(localStorage.getItem('books'))||[];
let chat=JSON.parse(localStorage.getItem('chat'))||[];

/* LOGIN */
function login(a){
    if(a){
        if(document.getElementById('pass').value!=="Itachi"){ alert("Špatné heslo"); return;}
        admin=true;
        document.getElementById('addBtn').style.display="inline";
    }
    document.getElementById('login').classList.remove('active');
    document.getElementById('nav').style.display="flex";
    openPage('news');
    render();
}

/* NAV */
function openPage(id){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

/* ADD BOOK */
document.getElementById('form').onsubmit=function(e){
    e.preventDefault();
    const r=new FileReader();
    r.onload=e=>{
        books.unshift({
            title:t.value,
            author:a.value,
            rating:r.value,
            img:e.target.result
        });
        localStorage.setItem('books',JSON.stringify(books));
        render();
    };
    r.readAsDataURL(img.files[0]);
};

/* RENDER */
function render(){
    const card=b=>`
    <div class="card">
        <img src="${b.img}">
        <h3>${b.title}</h3>
        <p>${b.author}</p>
        <b>⭐ ${b.rating}</b>
    </div>`;

    newsBox.innerHTML=books.slice(0,4).map(card).join('');
    allBox.innerHTML=books.map(card).join('');

    const top=[...books].sort((a,b)=>b.rating-a.rating);
    topBox.innerHTML=top.map((b,i)=>`#${i+1} ${b.title}`).join('<br>');

    chatList.innerHTML=chat.map(m=>`<div><b>${m.u}:</b> ${m.t}</div>`).join('');
}

/* SEARCH */
function search(){
    const q=search.value.toLowerCase();
    const f=books.filter(b=>b.title.toLowerCase().includes(q)||b.author.toLowerCase().includes(q));
    allBox.innerHTML=f.map(b=>`<div>${b.title}</div>`).join('');
}

/* CHAT */
function send(){
    if(!msg.value)return;
    chat.push({u:admin?"Admin":"Host",t:msg.value});
    localStorage.setItem('chat',JSON.stringify(chat));
    msg.value="";
    render();
}
</script>

</body>
</html>
