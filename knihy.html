<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Daragová knihovna</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
        }

        /* HLAVIČKA S OBRÁZKEM */
        .hero-section {
            background-image: url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 0 2000px rgba(0, 0, 0, 0.5);
        }

        .hero-section h1 {
            color: white;
            font-size: 3.5rem;
            margin: 0;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
        }

        /* NAVIGACE A VYHLEDÁVÁNÍ */
        nav {
            background-color: #2c3e50;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .nav-links a, .nav-links button {
            background-color: #34495e;
            color: white;
            text-decoration: none;
            border: none;
            padding: 8px 15px;
            margin-right: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .nav-links button:hover, .nav-links a:hover { background-color: #e74c3c; }

        .search-container { display: flex; align-items: center; }
        .search-container input {
            padding: 8px;
            border-radius: 4px;
            border: none;
            width: 250px;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
        }

        .view-section { display: none; }
        .view-section.active { display: block; }

        /* PŘIHLÁŠENÍ */
        .login-box {
            text-align: center;
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #fff;
        }

        input[type="text"], input[type="password"], input[type="number"], select, input[type="file"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .btn-admin { background-color: #27ae60; color: white; border: none; padding: 12px; width: 100%; cursor: pointer; border-radius: 4px; margin-top: 10px; }
        .btn-guest { background-color: #3498db; color: white; border: none; padding: 12px; width: 100%; cursor: pointer; border-radius: 4px; }

        /* KARTY KNIH */
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .book-card {
            border: 1px solid #eee;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            background: #fafafa;
        }

        .book-card img { width: 100%; height: 280px; object-fit: cover; border-radius: 4px; }
        .book-card h3 { font-size: 1.1em; margin: 10px 0; height: 2.4em; overflow: hidden; }
        .genre-tag { color: #e67e22; font-weight: bold; font-size: 0.9em; }

        #admin-form-area {
            background: #fff3e0;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border: 1px solid #ffe0b2;
        }
    </style>
</head>
<body>

    <header class="hero-section">
        <h1>Daragová knihovna</h1>
    </header>

    <nav>
        <div class="nav-links">
            <a href="https://darag93.github.io/my-web/">Zpět na hlavní stránku</a>
            <button onclick="logout()">Odhlásit / Menu</button>
        </div>
        
        <div class="search-container" id="search-bar-ui" style="display:none;">
            <span style="margin-right: 10px;">Hledejte...</span>
            <input type="text" id="book-search" placeholder="Název, autor nebo žánr..." onkeyup="filterBooks()">
        </div>
    </nav>

    <div class="container">

        <div id="login-view" class="view-section active">
            <div class="login-box">
                <h2>Vítejte</h2>
                <button class="btn-guest" onclick="loginAsReader()">Vstoupit bez přihlášení</button>
                
                <div style="margin: 30px 0; border-top: 1px solid #eee;"></div>
                
                <h3>Admin přístup</h3>
                <input type="password" id="admin-password" placeholder="Zadejte heslo...">
                <button class="btn-admin" onclick="loginAsAdmin()">Přihlásit jako Admin</button>
                <p id="error-msg" style="color:red; display:none;">Chybné heslo!</p>
            </div>
        </div>

        <div id="database-view" class="view-section">
            
            <div id="admin-form-area" style="display:none;">
                <h2>➕ Přidat novou knihu do databáze</h2>
                <form id="book-form">
                    <input type="text" id="title" placeholder="Název knihy" required>
                    <input type="text" id="author" placeholder="Autor" required>
                    
                    <label>Žánr:</label>
                    <select id="genre">
                        <optgroup label="Beletrie">
                            <option>Beletrie a vyprávění</option>
                            <option>Detektivky, krimi</option>
                            <option>Dobrodružné</option>
                            <option>Fantasy</option>
                            <option>Horory</option>
                            <option>Humor</option>
                            <option>Novely</option>
                            <option>Povídky</option>
                            <option>Romány</option>
                            <option>Sci-fi</option>
                            <option>Thrillery</option>
                            <option>Westerny</option>
                        </optgroup>
                        <optgroup label="Naučná literatura">
                            <option>Fakta a nauka</option>
                            <option>Biografie</option>
                            <option>Historie</option>
                            <option>Psychologie a filozofie</option>
                            <option>Umění a kultura</option>
