<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Daragová knihovna</title>
    <style>
        :root { --dark: #1a1a1a; --gold: #d4af37; --bg: #f4f1ea; --card: #ffffff; --accent: #8b0000; }
        body { font-family: 'Georgia', serif; margin: 0; background-color: var(--bg); color: #333; }

        /* HEADER */
        .hero { 
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?q=80&w=2000');
            background-size: cover; background-position: center; height: 150px;
            display: flex; align-items: center; justify-content: center; color: white;
        }

        /* LIŠTA */
        nav { 
            background: var(--dark); padding: 0 5%; display: flex; justify-content: space-between; 
            align-items: center; position: sticky; top: 0; z-index: 1000; height: 60px;
        }
        .nav-menu { display: flex; gap: 5px; }
        .nav-menu button { 
            background: transparent; color: #ccc; border: none; padding: 20px 15px; 
            cursor: pointer; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;
        }
        .nav-menu button:hover, .nav-menu button.active { color: var(--gold); border-bottom: 2px solid var(--gold); }
        
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .search-box input { padding: 8px; border-radius: 20px; border: 1px solid #444; background: #222; color: white; width: 150px; }

        /* OBSAH KARTY */
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* FORMULÁŘ */
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .full-width { grid-column: span 3; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-family: sans-serif; }
        .btn-save { background: var(--accent); color: white; border: none; padding: 15px; cursor: pointer; font-weight: bold; font-size: 1.1em; grid-column: span 3; }

        /* KNIŽNÍ KARTY */
        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .book-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-bottom: 4px solid var(--gold); }
        .book-card img { width: 100%; height: 380px; object-fit: cover; }
        .book-info { padding: 15px; }
        .status-tag { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.7em; text-transform: uppercase; margin-bottom: 5px; background: #eee; }

        /* TOP 10 LIST */
        .top-row { display: flex; align-items: center; background: white; margin-bottom: 10px; padding: 15px; border-radius: 8px; border-left: 10px solid var(--gold); }
        .top-rank { font-size: 2em; font-weight: bold; margin-right: 20px; color: var(--gold); width: 40px; }

        /* DISKUZE */
        .chat-container { background: white; padding: 20px; border-radius: 8px; }
        .msg-list { height: 400px; overflow-y: auto; border-bottom: 1px solid #eee; margin-bottom: 15px; }

    </style>
</head>
<body>

<header class="hero">
    <h1>Daragová knihovna</h1>
</header>

<nav>
    <div class="nav-menu">
        <button onclick="openPage('page-news')" id="btn-news">✨ Novinky</button>
        <button onclick="openPage('page-top10')">🏆 TOP 10</button>
        <button onclick="openPage('page-all')">📚 Knihy</button>
        <button onclick="openPage('page-chat')">💬 Diskuze</button>
        <button onclick="openPage('page-admin')" id="admin-link" style="color: var(--gold); display:none;">⚙️ Správa</button>
    </div>
    <div class="nav-right">
        <div class="search-box"><input type="text" id="gSearch" placeholder="Hledat..." onkeyup="search()"></div>
        <button onclick="showLogin()" style="background:none; border:1px solid var(--gold); color:var(--gold); padding:5px 10px; cursor:pointer; border-radius:4px;">🔑</button>
        <a href="https://darag93.github.io/my-web/" style="color:white; text-decoration:none; font-size:12px;">Zpět na web</a>
    </div>
</nav>

<div class="container">

    <div id="page-login" class="page active">
        <div style="text-align: center; max-width: 400px; margin: 100px auto; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
            <h2>Vstupte do knihovny</h2>
