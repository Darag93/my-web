<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Daragová knihovna</title>
    <style>
        /* --- ZÁKLADNÍ STYLY --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
        }

        /* 1. HLAVIČKA A VELKÝ OBRÁZEK KNIHOVNY */
        .hero-section {
            /* Zde je ilustrační obrázek knihovny z internetu. Můžeš nahradit vlastním URL. */
            background-image: url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 0 2000px rgba(0, 0, 0, 0.5); /* Tmavý filtr pro lepší čitelnost textu */
        }

        .hero-section h1 {
            color: white;
            font-size: 4rem;
            margin: 0;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            letter-spacing: 2px;
        }

        /* NAVIGACE */
        nav {
            background-color: #2c3e50;
            padding: 15px;
            text-align: center;
        }

        nav button {
            background-color: #34495e;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 0 10px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
        }

        nav button:hover {
            background-color: #e74c3c;
        }

        /* HLAVNÍ KONTEJNER */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* SKRÝVÁNÍ / ZOBRAZOVÁNÍ SEKACÍ */
        .view-section { display: none; }
        .view-section.active { display: block; }

        /* FORMULÁŘE A PŘIHLÁŠENÍ */
        .login-box {
            text-align: center;
            max-width: 400px;
            margin: 0 auto;
            padding: 30px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #fafafa;
        }

        input[type="text"], input[type="password"], input[type="number"], select, input[type="file"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0 20px;
            display: inline-block;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .btn-primary {
            background-color: #27ae60;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .btn-primary:hover { background-color: #219653; }
        
        .btn-secondary {
            background-color: #3498db;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }

        .btn-secondary:hover { background-color: #2980b9; }

        /* MŘÍŽKA KNIH (DATABÁZE) */
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .book-card {
            border: 1px solid #ecf0f1;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .book-card img {
            max-width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .book-card h3 { margin: 0 0 10px; color: #2c3e50; }
        .book-card p { margin: 5px 0; font-size: 14px; color: #7f8c8d; }
        .book-card .genre { font-weight: bold; color: #e67e22; }

        /* SEKCE PRO ADMINA */
        #admin-panel {
            background-color: #fdf2e9;
            padding: 20px;
            border-left: 5px solid #e67e22;
            border-radius: 4px;
            margin-bottom: 30px;
        }

    </style>
</head>
<body>

    <header class="hero-section">
        <h1>Daragová knihovna</h1>
    </header>

    <nav>
        <button onclick="switchView('login-view')">Hlavní nabídka / Přihlášení</button>
        <button onclick="switchView('database-view')" id="nav-db-btn" style="display:none;">Přejít do databáze</button>
    </nav>

    <div class="container">

        <div id="login-view" class="view-section active">
            <div class="login-box">
                <h2>Vítejte v knihovně</h2>
                <p>Vyberte způsob přihlášení:</p>
                <br>
                <button class="btn-secondary" onclick="loginAsReader()">Vstoupit jako Čtenář (pouze čtení)</button>
                
                <hr style="margin: 30px 0; border: 0; border-top: 1px solid #ccc;">
                
                <h3>Admin přístup</h3>
                <label for="admin-password">Zadejte heslo:</label>
                <input type="password" id="admin-password" placeholder="Heslo (Itachi)">
                <button class="btn-primary" onclick="loginAsAdmin()">Přihlásit jako Admin</button>
                <p id="login-error" style="color: red; display: none;">Nesprávné heslo!</p>
            </div>
        </div>

        <div id="database-view" class="view-section">
            
            <div id="welcome-message" style="margin-bottom: 20px; font-size: 1.2em;"></div>

            <div id="admin-panel" style="display: none;">
                <h2>➕ Přidat novou knihu</h2>
                <form id="add-book-form">
                    <label>Název knihy:</label>
                    <input type="text" id="b-title" required>

                    <label>Autor:</label>
                    <input type="text" id="b-author" required>

                    <label>Žánr / Kategorie:</label>
                    <select id="b-genre" required>
                        <option value="Sci-Fi">Sci-Fi</option>
                        <option value="Fantasy">Fantasy</option>
                        <option value="Detektivka">Detektivka</option>
                        <option value="Román">Román</option>
                        <option value="Odborná literatura">Odborná literatura</option>
                        <option value="Poezie">Poezie</option>
                        <option value="Jiné">Jiné</option>
                    </select>

                    <label>Rok vydání:</label>
                    <input type="number" id="b-year" required>

                    <label>ISBN:</label>
                    <input type="text" id="b-isbn" required>

                    <label>Vydavatelství:</label>
                    <input type="text" id="b-publisher" required>

                    <label>Fotka obálky knihy:</label>
                    <input type="file" id="b-image" accept="image/*" required>

                    <button type="submit" class="btn-primary">Uložit knihu do databáze</button>
                </form>
            </div>

            <h2>Seznam všech knih</h2>
            <div class="book-grid" id="book-list">
                </div>

        </div>

    </div>

    <script>
        // Konstanty a proměnné
        const ADMIN_PASSWORD = "Itachi";
        let currentUserRole = null; // 'admin' nebo 'reader'
        let books = JSON.parse(localStorage.getItem('daragovaKnihovna')) || [];

        // Funkce pro přepínání pohledů (přihlášení vs databáze)
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        // Přihlášení jako čtenář
        function loginAsReader() {
            currentUserRole = 'reader';
            setupEnvironment();
        }

        // Přihlášení jako admin
        function loginAsAdmin() {
            const passwordInput = document.getElementById('admin-password').value;
            if (passwordInput === ADMIN_PASSWORD) {
                currentUserRole = 'admin';
                document.getElementById('login-error').style.display = 'none';
                document.getElementById('admin-password').value = ''; // Vymaže heslo z políčka
                setupEnvironment();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        // Nastavení prostředí podle role
        function setupEnvironment() {
            switchView('database-view');
            document.getElementById('nav-db-btn').style.display = 'inline-block';
            
            const welcomeMsg = document.getElementById('welcome-message');
            const adminPanel = document.getElementById('admin-panel');

            if (currentUserRole === 'admin') {
                welcomeMsg.innerHTML = "<strong>Jsi přihlášen jako: ADMIN.</strong> Můžeš přidávat nové knihy.";
                adminPanel.style.display = 'block';
            } else {
                welcomeMsg.innerHTML = "<strong>Jsi přihlášen jako: ČTENÁŘ.</strong> Můžeš si knihy pouze prohlížet.";
                adminPanel.style.display = 'none';
            }

            renderBooks();
        }

        // Zpracování formuláře pro přidání knihy
        document.getElementById('add-book-form').addEventListener('submit', function(e) {
            e.preventDefault(); // Zabrání znovunačtení stránky

            const imageFile = document.getElementById('b-image').files[0];
            
            // Přečtení obrázku a jeho převedení na Base64 (aby šel uložit lokálně)
            const reader = new FileReader();
            reader.onload = function(event) {
                const newBook = {
                    title: document.getElementById('b-title').value,
                    author: document.getElementById('b-author').value,
                    genre: document.getElementById('b-genre').value,
                    year: document.getElementById('b-year').value,
                    isbn: document.getElementById('b-isbn').value,
                    publisher: document.getElementById('b-publisher').value,
                    image: event.target.result // Base64 kód obrázku
                };

                // Uložení do pole a do paměti prohlížeče
                books.push(newBook);
                localStorage.setItem('daragovaKnihovna', JSON.stringify(books));
                
                // Vymazání formuláře a překreslení knih
                document.getElementById('add-book-form').reset();
                renderBooks();
                alert("Kniha byla úspěšně přidána!");
            };

            if (imageFile) {
                reader.readAsDataURL(imageFile);
            }
        });

        // Vykreslení knih do HTML
        function renderBooks() {
            const bookList = document.getElementById('book-list');
            bookList.innerHTML = ''; // Vyčistíme předchozí obsah

            if (books.length === 0) {
                bookList.innerHTML = "<p>Databáze je zatím prázdná.</p>";
                return;
            }

            books.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <img src="${book.image}" alt="Obálka knihy ${book.title}">
                    <h3>${book.title}</h3>
                    <p class="genre">${book.genre}</p>
                    <p><strong>Autor:</strong> ${book.author}</p>
                    <p><strong>Rok vydání:</strong> ${book.year}</p>
                    <p><strong>Vydavatelství:</strong> ${book.publisher}</p>
                    <p><strong>ISBN:</strong> ${book.isbn}</p>
                `;
                bookList.appendChild(card);
            });
        }
    </script>

</body>
</html>
