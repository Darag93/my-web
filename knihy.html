<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daragová knihovna</title>
    <style>
        :root { --dark: #1a1a1a; --gold: #d4af37; --bg: #f4f1ea; --accent: #8b0000; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: var(--bg); color: #333; }

        /* HEADER */
        .hero { 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2000');
            background-size: cover; background-position: center; height: 180px;
            display: flex; align-items: center; justify-content: center; color: white;
        }

        /* NAVIGACE - ČERNÁ LIŠTA */
        nav { 
            background: var(--dark); padding: 0 5%; display: none; justify-content: space-between; 
            align-items: center; position: sticky; top: 0; z-index: 1000; height: 60px;
        }
        .nav-links { display: flex; gap: 15px; }
        .nav-links button { 
            background: transparent; color: white; border: none; padding: 10px; 
            cursor: pointer; font-size: 14px; font-weight: bold; text-transform: uppercase;
        }
        .nav-links button:hover { color: var(--gold); }
        
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .search-input { padding: 8px 15px; border-radius: 20px; border: 1px solid #444; background: #333; color: white; width: 180px; }

        /* OBSAH */
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .page { display: none; }
        .page.active { display: block; }

        /* PŘIHLÁŠENÍ - KARTA */
        .login-card { 
            max-width: 450px; margin: 50px auto; background: white; padding: 40px; 
            border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; 
        }
        .btn-black { width: 100%; padding: 15px; background: #222; color: white; border: none; cursor: pointer; font-weight: bold; margin-bottom: 20px; border-radius: 4px; }
        .btn-red { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; }

        /* KNIHY MŘÍŽKA */
        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; }
        .book-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .book-card img { width: 100%; height: 350px; object-fit: cover; }
        .book-content { padding: 15px; }

        /* ADMIN FORM */
        .admin-form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: white; padding: 25px; border-radius: 8px; border-top: 5px solid var(--accent); }
        .full { grid-column: span 2; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
    </style>
</head>
<body>

<header class="hero">
    <h1 style="font-size: 3rem; text-shadow: 2px 2px 10px rgba(0,0,0,0.5);">Daragová knihovna</h1>
</header>

<nav id="mainNav">
    <div class="nav-links">
        <button onclick="showSection('p-news')">✨ Novinky</button>
        <button onclick="showSection('p-top')">🏆 TOP 10</button>
        <button onclick="showSection('p-all')">📚 Knihy</button>
        <button id="adminLink" onclick="showSection('p-add')" style="display:none; color:var(--gold);">⚙️ Přidat</button>
    </div>
    <div class="nav-right">
        <input type="text" class="search-input" id="searchBar" placeholder="Hledat..." onkeyup="searchBooks()">
        <button onclick="location.reload()" style="background:none; border:1px solid #555; color:white; cursor:pointer; border-radius:4px; padding:5px 10px;">Odhlásit</button>
    </div>
</nav>

<div class="container">

    <div id="p-login" class="page active">
        <div class="login-card">
            <h2>Vítejte</h2>
            <button class="btn-black" onclick="login(false)">Vstoupit bez přihlášení</button>
            <p style="color: #888;">nebo</p>
            <h3>Admin přístup</h3>
            <input type="password" id="passCode" placeholder="Heslo..." style="margin-bottom:15px; text-align:center;">
            <button class="btn-red" onclick="login(true)">Přihlásit se</button>
        </div>
    </div>

    <div id="p-news" class="page">
        <h2>✨ Poslední přírůstky</h2>
        <div id="news-grid" class="book-grid"></div>
    </div>

    <div id="p-all" class="page">
        <h2>📚 Moje celá sbírka</h2>
        <div id="all-grid" class="book-grid"></div>
    </div>

    <div id="p-top" class="page">
        <h2>🏆 Nejlépe hodnocené knihy</h2>
        <div id="top-list"></div>
    </div>

    <div id="p-add" class="page">
        <h2>⚙️ Administrace: Nová kniha</h2>
        <form id="bookForm" class="admin-form">
            <input type="text" id="t" placeholder="Název" required>
            <input type="text" id="a" placeholder="Autor" required>
            <input type="text" id="y" placeholder="Rok">
            <input type="text" id="g" placeholder="Žánr">
            <input type="number" id="r" placeholder="Hodnocení (1-10)" min="1" max="10">
            <input type="text" id="i" placeholder="ISBN">
            <textarea id="d" class="full" rows="3" placeholder="Anotace..."></textarea>
            <input type="file" id="f" class="full" accept="image/*" required>
            <button type="submit" class="btn-red full">💾 Uložit do knihovny</button>
        </form>
    </div>

</div>

<script>
    let is_admin = false;
    let data = JSON.parse(localStorage.getItem('darag_final_data')) || [];

    function login(adminReq) {
        if(adminReq) {
            const p = document.getElementById('passCode').value;
            if(p === "Itachi") {
                is_admin = true;
                document.getElementById('adminLink').style.display = "block";
            } else {
                alert("Špatné heslo!"); return;
            }
        }
        document.getElementById('p-login').style.display = "none";
        document.getElementById('mainNav').style.display = "flex";
        showSection('p-news');
        renderAll();
    }

    function showSection(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    document.getElementById('bookForm').onsubmit = function(e) {
        e.preventDefault();
        const reader = new FileReader();
        reader.onload = (event) => {
            const newBook = {
                title: document.getElementById('t').value,
                author: document.getElementById('a').value,
                rating: document.getElementById('r').value,
                img: event.target.result,
                id: Date.now()
            };
            data.unshift(newBook);
