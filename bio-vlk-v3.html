<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>BioFlow 🐺</title>
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121212">
    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            background: #121212;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100vh;
        }
        .container { padding: 20px; max-width: 400px; margin: auto; width: 90%; }
        h1 { color: #00cf5d; margin: 0 0 5px 0; font-size: 2.5rem; }
        .subtitle { color: #666; font-size: 0.9rem; margin-bottom: 20px; }
        .card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 25px;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #timer {
            font-size: 4rem;
            font-weight: bold;
            color: #00cf5d;
            margin: 15px 0;
            font-variant-numeric: tabular-nums;
        }
        .status-text { color: #888; font-size: 1.1rem; font-weight: bold; }
        .btn {
            width: 100%;
            padding: 20px;
            border-radius: 50px;
            border: none;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn-start { background: #00cf5d; color: #000; }
        .btn-reset { background: #333; color: #888; margin-top: 10px; font-size: 0.9rem; padding: 10px; }
        .btn-stop { background: #ff3b30; color: #fff; display: none; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .footer { position: absolute; bottom: 20px; width: 100%; color: #333; font-size: 0.8rem; left: 0; }
    </style>
</head>
