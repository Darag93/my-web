<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>BioFlow 🐺</title>
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: white; margin: 0; display: flex; flex-direction: column; justify-content: center; height: 100vh; }
        .container { padding: 20px; max-width: 400px; margin: auto; }
        h1 { color: #00cf5d; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 25px; border: 1px solid #333; margin: 20px 0; }
        #timer { font-size: 4rem; color: #00cf5d; font-weight: bold; margin: 10px 0; }
        .label { color: #888; font-weight: bold; text-transform: uppercase; }
        .btn { width: 100%; padding: 20px; border-radius: 50px; border: none; font-size: 1.2rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-start { background: #00cf5d; color: black; }
        .btn-stop { background: #ff3b30; color: white; display: none; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        input[type="file"] { margin: 10px 0; color: #555; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>BioFlow 🐺</h1>
    <div class="card">
        <div id="label" class="label">PŘIPRAVEN</div>
        <div id="timer">00:00:00</div>
        <div id="info" style="font-size: 0.8rem; color: #555;">Další: Voda (2h)</div>
    </div>

    <div style="margin-bottom: 10px;">
        <span style="font-size: 0.7rem; color: #888;">NASTAVIT VLASTNÍ HUDBU (MP3):</span><br>
        <input type="file" id="musicInput" accept="audio/*">
    </div>

    <button id="mainBtn" class="btn btn-start" onclick="toggleApp()">SPUSTIT PROGRAM 🐺</button>
    <button id="stopBtn" class="btn btn-stop" onclick="stopAlarm()">VYPNOUT BUDÍK 🛑</button>
</div>

<script>
    let timeLeft;
    let timerInterval;
    let isRunning = false;
    let currentMode = 'voda'; // voda (2h) nebo chuze (1h)
    
    let audio = new Audio();
    audio.loop = true;

    // Nahrání vlastní hudby
    document.getElementById('musicInput').onchange = function(e) {
        const file = e.target.files[0];
        if (file) audio.src = URL.createObjectURL(file);
    };

    function updateDisplay() {
        const h = Math.floor(timeLeft / 3600);
        const m = Math.floor((timeLeft % 3600) / 60);
        const s = timeLeft % 60;
        document.getElementById('timer').innerText = 
            `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function toggleApp() {
        if (!isRunning) {
            if (!audio.src) audio.src = 'https://actions.google.com/sounds/v1/alarms/beep_short.ogg';
            Notification.requestPermission();
            startSequence();
            document.getElementById('mainBtn').innerText = "PROGRAM BĚŽÍ...";
            document.getElementById('mainBtn').disabled = true;
            isRunning = true;
        }
    }

    function startSequence() {
        if (currentMode === 'voda') {
            timeLeft = 2 * 3600; // 2 hodiny
            document.getElementById('label').innerText = "💧 PIJ VODU (450ml)";
            document.getElementById('info').innerText = "Poté následuje: Chůze (1h)";
        } else {
            timeLeft = 1 * 3600; // 1 hodina
            document.getElementById('label').innerText = "🚶 VSTAŇ A CHOĎ (2min)";
            document.getElementById('info').innerText = "Poté následuje: Voda (2h)";
        }
        updateDisplay();

        timerInterval = setInterval(() => {
            timeLeft--;
            updateDisplay();
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                audio.play();
                document.getElementById('stopBtn').style.display = "block";
            }
        }, 1000);
    }

    function stopAlarm() {
        audio.pause();
        audio.currentTime = 0;
        document.getElementById('stopBtn').style.display = "none
