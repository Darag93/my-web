<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cesta do Japonska - Rozcestník</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #f4f4f4;
            color: #000;
            text-align: center;
            margin: 0;
            padding: 100px 20px;
        }

        .card {
            background: #ffffff;
            max-width: 500px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 25px;
            color: #000;
        }

        .rotoped-icon {
            max-width: 220px;
            height: auto;
            margin-bottom: 25px;
            border-radius: 6px;
        }

        .btn {
            display: inline-block;
            background-color: #d32f2f;
            color: white;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #b71c1c;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Cesta do JAPONSKA na ROTOPEDU</h1>
        <div>
            <img src="https://www.insportline.cz/p165633/Rotoped-inSPORTLine-inCondi-UB600i-26.jpg"
                alt="Rotoped inSPORTline" class="rotoped-icon">
        </div>
        <a href="japonsko.html" class="btn">Otevřít cestu</a>
    </div>

</body>

</html>
